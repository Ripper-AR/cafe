name: on_the_horse_cafeteria
description: "An offline-first menu and WhatsApp ordering app for On The Horse Cafeteria."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/cafeteria-brand.jpg

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#101411"
  image_path: assets/app_icon.png
  adaptive_icon_background: "#101411"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#101411"
    theme_color: "#101411"
